<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="Professional profile banner for Telaprolu Lakshmi Srinivas, AI Engineer focused on LLMs, RAG, Agentic AI and AI automation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;0.2;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.8;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="75%" r="60%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
      .h { font-size: 14px; font-weight: 700; letter-spacing: 2.2px; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .value { font-size: 14px; }
    </style>
  </defs>

  <rect x="10" y="10" width="1160" height="590" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="10" y="10" width="1160" height="590" rx="24" fill="url(#grid)" opacity="0.34"/>
  <rect x="10" y="10" width="1160" height="590" rx="24" fill="url(#glowA)"/>
  <rect x="10" y="10" width="1160" height="590" rx="24" fill="url(#glowB)"/>

  <!-- terminal chrome -->
  <rect x="10" y="10" width="1160" height="48" rx="24" fill="#0F172A" fill-opacity="0.82"/>
  <rect x="10" y="34" width="1160" height="24" fill="#0F172A" fill-opacity="0.82"/>
  <circle cx="38" cy="34" r="6" fill="#FF5F57"/>
  <circle cx="60" cy="34" r="6" fill="#FEBC2E"/>
  <circle cx="82" cy="34" r="6" fill="#28C840"/>
  <text x="108" y="39" class="mono small" fill="#94A3B8">srinivastls@profile:~</text>
  <text x="1058" y="39" class="mono small" text-anchor="end" fill="#10B981">[ ONLINE ]</text>

  <!-- left visual identity -->
  <rect x="34" y="82" width="402" height="486" rx="20" fill="#0F172A" fill-opacity="0.64"
        stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="62" y="116" class="mono h" fill="#22D3EE">VISUAL.MAP</text>
  <line x1="62" y1="128" x2="408" y2="128" stroke="#22D3EE" stroke-opacity="0.25"/>

  <!-- terminal-style abstract identity glyph; no personal raster image supplied -->
  <g class="mono" fill="#22D3EE" opacity="0.90">
    <text x="78" y="177" font-size="16">          .·:+*#%@@%#*+:.          </text>
    <text x="78" y="195" font-size="16">       .:+#@@@@@@@@@@@@%*:.       </text>
    <text x="78" y="213" font-size="16">     :*%@@@@@@@@@@@@@@@@@@%*:     </text>
    <text x="78" y="231" font-size="16">    +%@@@@%*+::::+*%@@@@@@@%+    </text>
    <text x="78" y="249" font-size="16">   *@@@@@+.  .:::.  .+@@@@@@@*   </text>
    <text x="78" y="267" font-size="16">  :@@@@@+  :#@@@@@#:  +@@@@@@@:  </text>
    <text x="78" y="285" font-size="16">  %@@@@@.  %@@@@@@@%  .@@@@@@@%  </text>
    <text x="78" y="303" font-size="16">  @@@@@@.  %@@@#@@@%  .@@@@@@@%  </text>
    <text x="78" y="321" font-size="16">  %@@@@@+  :#@@@@@#:  +@@@@@@@%  </text>
    <text x="78" y="339" font-size="16">  :@@@@@@+.  .::::.  .+@@@@@@@@:  </text>
    <text x="78" y="357" font-size="16">   *@@@@@@%*::::::::*%@@@@@@@@*   </text>
    <text x="78" y="375" font-size="16">    +%@@@@@@@@@@@@@@@@@@@@@@%+    </text>
    <text x="78" y="393" font-size="16">     :*%@@@@@@@@@@@@@@@@@@%*:     </text>
    <text x="78" y="411" font-size="16">       .:+#%@@@@@@@@%#*+:.       </text>
  </g>
  <g opacity="0.16" stroke="#22D3EE" stroke-width="1">
    <line x1="60" y1="176" x2="408" y2="176">
      <animate attributeName="y1" values="176;412;176" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="176;412;176" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="62" y="452" class="mono label" fill="#94A3B8">IDENTITY</text>
  <text x="62" y="478" class="mono body" fill="#F8FAFC">AI Engineer</text>
  <text x="62" y="500" class="mono body" fill="#22D3EE">LLMs · RAG · Agentic AI</text>
  <text x="62" y="522" class="mono body" fill="#94A3B8">AI automation · NLP · Research</text>
  <text x="62" y="548" class="mono small" fill="#10B981">~/profile $ build --ship</text>

  <!-- right system panel -->
  <rect x="458" y="82" width="688" height="486" rx="20" fill="#111827" fill-opacity="0.62"
        stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="492" y="116" class="mono h" fill="#22D3EE">SYSTEM.INFO</text>
  <text x="1112" y="116" class="mono small" text-anchor="end" fill="#94A3B8">profile.sh</text>
  <line x1="492" y1="128" x2="1112" y2="128" stroke="#1E293B"/>

  <text x="492" y="158" class="mono small" fill="#94A3B8">srinivastls@profile:~$ ./profile.sh</text>

  <g class="mono">
    <text x="492" y="198" class="label" fill="#94A3B8">NAME</text>
    <text x="638" y="198" class="value" fill="#F8FAFC">Telaprolu Lakshmi Srinivas</text>

    <text x="492" y="232" class="label" fill="#94A3B8">ROLE</text>
    <text x="638" y="232" class="value" fill="#22D3EE">AI Engineer · AI/ML Engineer</text>

    <text x="492" y="266" class="label" fill="#94A3B8">CURRENT</text>
    <text x="638" y="266" class="value" fill="#F8FAFC">M.Tech Artificial Intelligence @ IIT Roorkee</text>

    <text x="492" y="300" class="label" fill="#94A3B8">EXPERIENCE</text>
    <text x="638" y="300" class="value" fill="#F8FAFC">Accenture · AI &amp; Enterprise Automation</text>

    <text x="492" y="334" class="label" fill="#94A3B8">FOCUS</text>
    <text x="638" y="334" class="value" fill="#F8FAFC">LLMs · RAG · Agentic AI · NLP</text>

    <text x="492" y="368" class="label" fill="#94A3B8">STACK</text>
    <text x="638" y="368" class="value" fill="#F8FAFC">Python · PyTorch · Transformers · FastAPI</text>
    <text x="638" y="389" class="value" fill="#F8FAFC">Milvus · FAISS · Docker · Kubernetes · GCP</text>

    <text x="492" y="423" class="label" fill="#94A3B8">BUILDING</text>
    <text x="638" y="423" class="value" fill="#F8FAFC">NyayaMitra · 91-crpc · cp_snippets</text>
  </g>

  <line x1="492" y1="448" x2="1112" y2="448" stroke="#1E293B"/>
  <text x="492" y="476" class="mono small" fill="#94A3B8">SELECTED SIGNALS</text>

  <g class="mono">
    <rect x="492" y="492" width="128" height="30" rx="15" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.42"/>
    <text x="556" y="512" text-anchor="middle" class="small" fill="#22D3EE">LLMs</text>
    <rect x="630" y="492" width="128" height="30" rx="15" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-opacity="0.42"/>
    <text x="694" y="512" text-anchor="middle" class="small" fill="#7C3AED">RAG</text>
    <rect x="768" y="492" width="160" height="30" rx="15" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.42"/>
    <text x="848" y="512" text-anchor="middle" class="small" fill="#10B981">AGENTIC AI</text>
    <rect x="938" y="492" width="174" height="30" rx="15" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-opacity="0.42"/>
    <text x="1025" y="512" text-anchor="middle" class="small" fill="#7C3AED">LEGAL AI · NLP</text>
  </g>

  <text x="492" y="550" class="mono small" fill="#10B981">
    $ echo "Build practical AI. Publish meaningful research. Ship useful products."
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4.5s" repeatCount="indefinite"/>
  </text>
</svg>
